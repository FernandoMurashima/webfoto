<div class="page">
  <!-- Topbar com brand centralizado -->
  <header class="topbar">
    <!-- Botão do menu (mobile) fica à esquerda -->
    <button class="menu-btn" (click)="menuAberto = !menuAberto" aria-label="Abrir menu">☰</button>

    <!-- Brand sempre centralizado -->
    <div class="brand">MAYARA MURASHIMA</div>

    <!-- Navegação desktop à direita -->
   <!--  <nav class="nav-desktop">
      <a routerLink="" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="sobre" routerLinkActive="active">Sobre</a>
      <a routerLink="trabalhos" routerLinkActive="active">Trabalhos</a>
      <a routerLink="orcamento" routerLinkActive="active">Orçamento</a>
    </nav> -->
  </header>

  <!-- Menu mobile -->
  <nav class="nav-mobile" [class.aberto]="menuAberto">
    <a routerLink="" (click)="menuAberto=false" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
    <a routerLink="sobre" (click)="menuAberto=false" routerLinkActive="active">Sobre</a>
    <a routerLink="trabalhos" (click)="menuAberto=false" routerLinkActive="active">Trabalhos</a>
    <a routerLink="orcamento" (click)="menuAberto=false" routerLinkActive="active">Orçamento</a>
  </nav>

    <!-- Banner horizontal (funcionalidades) -->
  <div class="feature-banner">
    <div class="feature-wrap">
      <a class="feature-link" routerLink="" (click)="menuAberto=false" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a class="feature-link" routerLink="sobre" (click)="menuAberto=false" routerLinkActive="active">Sobre</a>
      <a class="feature-link" routerLink="trabalhos" (click)="menuAberto=false" routerLinkActive="active">Trabalhos</a>
      <a class="feature-link" routerLink="orcamento" (click)="menuAberto=false" routerLinkActive="active">Orçamento</a>
    </div>
  </div>

  <!-- Conteúdo -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <!-- Rodapé com contatos -->
  <footer class="footer">
    <div class="footer-wrap">
      <div class="brand-mini">© {{ currentYear }} Mayara Murashima</div>

      <div class="contacts">
        <a class="contato" href="https://wa.me/5521999060204" target="_blank" rel="noopener">📞 WhatsApp</a>
        <a class="contato" href="mailto:may.casmurashima@gmail.com" target="_blank" rel="noopener">✉️ Email</a>
        <a class="contato" href="https://www.instagram.com/may.murashima" target="_blank" rel="noopener">📷 Instagram</a>
      </div>
    </div>
  </footer>
</div>
